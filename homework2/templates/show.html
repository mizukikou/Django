<body>
    <!-- HTML content for the page -->
    <h1> 您好： {{username}} </h1>
    <a href="https://share.google/aimode/jAznfwHa1zHxwjZZa">苦瓜的健康料理－苦瓜鑲肉</a>
    <ul>
          <li>材料
              <ol type="a">
                  <li>苦瓜</li>
                  <li>大白菜</li>
                  <li>豬肉絞肉</li>
                  <li>太白粉</li>
                  <li>鹽</li>
              </ol>
          </li>
    </ul>

    <ul>
          <li>作法
              <ol type="1">
                  <li>苦瓜橫切成數塊，然後將內膜和子去除乾淨，使其成中空圈狀。</li>
                  <li>鹽漬數分鐘去除苦味。</li>
                  <li>將豬肉絞肉鑲進中空圈狀的苦瓜中，然後沾少許太白粉水，使其黏固。</li>
                  <li>用油煎熟，然後加入大白菜及少許水悶煮數分鐘即可。</li>
              </ol>
          </li>
    </ul>
</body>
</html>
