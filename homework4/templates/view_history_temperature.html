<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史溫溼度顯示</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 40px;
    }
    h1 {
      font-size: 3.2em;
      font-weight: bold;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 2.2em;
      font-weight: bold;
    }
    th, td {
      padding: 10px 0;
      text-align: left;
    }
    th:nth-child(1), td:nth-child(1) { width: 8%; }  /* id */
    th:nth-child(2), td:nth-child(2) { width: 18%; } /* sensor_id */
    th:nth-child(3), td:nth-child(3) { width: 12%; } /* 溫度 */
    th:nth-child(4), td:nth-child(4) { width: 12%; } /* 濕度 */
    th:nth-child(5), td:nth-child(5) { width: 50%; } /* 時間 */
  </style>
</head>
<body>

  <h1>歷史溫溼度顯示</h1>

  <table>
    <thead>
      <tr>
        <th>id</th>
        <th>sensor_id</th>
        <th>溫度</th>
        <th>濕度</th>
        <th>時間</th>
      </tr>
    </thead>
    <tbody>
      {% for data in records %}
        <tr>
          <td>{{ data.myid }}</td> 
          <td>{{ data.sensor_id }}</td>
          <td>{{ data.temperature }}</td>
          <td>{{ data.humidity }}</td>
          <td>{{ data.timestamp|date:"Y-m-d H:i:s" }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

</body>
</html>
