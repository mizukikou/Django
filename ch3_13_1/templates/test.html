<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>學生資料清單</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:hover { background-color: #f5f5f5; }
    </style>
</head>
<body>

    <h2>學生資料管理系統</h2>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>姓名</th>
                <th>性別</th>
                <th>生日</th>
                <th>Email</th>
                <th>電話</th>
                <th>地址</th>
                <th>身高</th>
                <th>體重</th>
            </tr>
        </thead>
        <tbody>
            <!-- 使用 Django 迴圈跑出後端傳來的每一筆學生字典資料 -->
            {% for student in data %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.cName }}</td>
                <td>{{ student.cSex }}</td>
                <td>{{ student.cBirthday }}</td>
                <td>{{ student.cEmail }}</td>
                <td>{{ student.cPhone }}</td>
                <td>{{ student.cAddr }}</td>
                <td>{{ student.cHeight }} cm</td>
                <td>{{ student.cWeight }} kg</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="9" style="text-align: center;">目前資料庫中沒有任何學生資料。</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
