{% extends "base.html" %}
{% block title %}學生資料管理系統 - 編輯資料{% endblock %}
{% block content %}
<div class="container" style="max-width: 640px;">
    <h1>編輯學生資料</h1>

    <div class="nav-bar">
        <a href="{% url 'index' %}" class="btn btn-info">← 回到首頁</a>
    </div>

    <form method="post" action="{% url 'edit' student.cid %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="cid">學號</label>
            <input type="text" id="cid" name="cid" value="{{ student.cid }}" readonly
                   style="background:#f5f5f5; color:#999;">
        </div>

        <div class="form-group">
            <label for="cname">姓名</label>
            <input type="text" id="cname" name="cname" value="{{ student.cname }}" required>
        </div>

        <div class="form-group">
            <label>性別</label>
            <label style="display:inline-block; font-weight:normal; margin-right:20px;">
                <input type="radio" name="csex" value="M" {% if student.csex == "M" %}checked{% endif %}> 男
            </label>
            <label style="display:inline-block; font-weight:normal;">
                <input type="radio" name="csex" value="F" {% if student.csex == "F" %}checked{% endif %}> 女
            </label>
        </div>

        <div class="form-group">
            <label for="cbirthday">生日</label>
            <input type="date" id="cbirthday" name="cbirthday" value="{{ student.cbirthday|date:'Y-m-d' }}">
        </div>

        <div class="form-group">
            <label for="cphone">電話</label>
            <input type="text" id="cphone" name="cphone" value="{{ student.cphone }}">
        </div>

        <div class="form-group">
            <label for="caddr">地址</label>
            <input type="text" id="caddr" name="caddr" value="{{ student.caddr }}">
        </div>

        <div class="form-group">
            <label for="cemail">電子郵件</label>
            <input type="email" id="cemail" name="cemail" value="{{ student.cemail }}">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">💾 更新資料</button>
        </div>
    </form>
</div>
{% endblock %}
