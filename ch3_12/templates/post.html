{% extends "base.html" %}
{% block title %}學生資料管理系統 - 新增資料{% endblock %}
{% block content %}
<div class="container" style="max-width: 640px;">
    <h1>新增學生資料</h1>

    <div class="nav-bar">
        <a href="{% url 'index' %}" class="btn btn-info">← 回到首頁</a>
    </div>

    <form method="post" action="{% url 'post' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="cid">學號</label>
            <input type="text" id="cid" name="cid" required>
        </div>

        <div class="form-group">
            <label for="cname">姓名</label>
            <input type="text" id="cname" name="cname" required>
        </div>

        <div class="form-group">
            <label>性別</label>
            <label style="display:inline-block; font-weight:normal; margin-right:20px;">
                <input type="radio" name="csex" value="M" checked> 男
            </label>
            <label style="display:inline-block; font-weight:normal;">
                <input type="radio" name="csex" value="F"> 女
            </label>
        </div>

        <div class="form-group">
            <label for="cbirthday">生日</label>
            <input type="date" id="cbirthday" name="cbirthday">
        </div>

        <div class="form-group">
            <label for="cphone">電話</label>
            <input type="text" id="cphone" name="cphone">
        </div>

        <div class="form-group">
            <label for="caddr">地址</label>
            <input type="text" id="caddr" name="caddr">
        </div>

        <div class="form-group">
            <label for="cemail">信箱</label>
            <input type="email" id="cemail" name="cemail">
        </div>

        <div class="actions">
            <input type="submit" class="btn btn-success" value="✨ 新增資料">
        </div>
    </form>
</div>
{% endblock %}
