{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice 2</title>
</head>
<body>
  <h1>Student Information</h1>
  <p>ID: {{ student.id }}</p>
  <p>Name: {{ student.name }}</p>
  <p>Sex: {{ student.sex }}</p>
  {% if student.sex == 'M' %}
    <p>Gender: Male</p>
  {% else %}
    <p>Gender: Female</p>
  {% endif %} 

  <h1>Fruits</h1>
  <ul>
    {% for fruit in fruits %}
      <li>{{ fruit }}</li>
    {% endfor %}
      <li>{{ fruits.0 }}</li>
  </ul>
</body>
</html>
