{% extends "base.html"  %}
{% block title %}學生資料管理系統 - 編輯資料{% endblock %}
{% block content %}
<style>
    form {
        text-align: left;           /* 1. 讓表單內部的文字和輸入框靠左對齊，比較整齊 */
        border: 1px solid rgb(199, 22, 110);
        padding: 20px 40px;         /* 上下 20px，左右 40px 的內距 */
        margin: 20px auto;          /* 2. 上下留點空隙，並且靠 margin: auto 讓整個表單居中 */
        width: 320px;               /* 3. 關鍵：限制表單寬度，才不會無限延伸 */
        border-radius: 8px;         /* 順便幫你加上圓角，看起來更現代專業 */
    }
    
    /* 4. 讓每個輸入框的前置標籤（如學號、姓名）統一寬度，輸入框才會完美對齊 */
    form label.field-title {
        display: inline-block;
        width: 60px;
        text-align: right;
        margin-right: 10px;
    }
    
    /* 5. 讓新增按鈕單獨置中 */
    .submit-container {
        text-align: center;
        margin-top: 15px;
    }
</style>
<h1 style="text-align: center;">編輯學生資料</h1>
<h3 style="text-align: center;"><a href="{% url 'index' %}">回到首頁</a></h3>

<form method="post" action="{% url 'edit' student.cid %}">
    {% csrf_token %}
    
    <!-- 💡 補上 class="field-title" 與雙換行，讓畫面變整齊 -->
    <label for="cid" class="field-title">學號：</label>
    <input type="text" id="cid" name="cid" value="{{ student.cid }}" readonly><br><br>
    
    <label for="cname" class="field-title">姓名：</label>
    <input type="text" id="cname" name="cname" value="{{ student.cname }}" required><br><br>
    
    <label class="field-title">性別：</label>
    <input type="radio" id="csex_m" name="csex" value="M" {% if student.csex == "M" %}checked{% endif %}><label for="csex_m">男</label>
    <input type="radio" id="csex_f" name="csex" value="F" {% if student.csex == "F" %}checked{% endif %}><label for="csex_f">女</label>
    <br><br>
    
    <label for="cemail" class="field-title">電子郵件：</label>
    <input type="email" id="cemail" name="cemail" value="{{ student.cemail }}"><br><br>
    
    <label for="cphone" class="field-title">電話：</label>
    <input type="text" id="cphone" name="cphone" value="{{ student.cphone }}"><br><br>
    
    <!-- 💡 核心修正點：加上 |date:"Y-m-d" 濾鏡，完美破除引發 ValidationError 的過期髒資料問題 -->
    <!-- 💡 注意內部的 'Y-m-d' 必須是按鍵盤 L 鍵右邊那個「英文半形單引號」 -->
    <label for="cbirthday" class="field-title">生日：</label>
    <input type="date" id="cbirthday" name="cbirthday" value="{{ student.cbirthday|date:'Y-m-d' }}"><br><br>

    
    <label for="caddr" class="field-title">地址：</label>
    <input type="text" id="caddr" name="caddr" value="{{ student.caddr }}"><br><br>
    
    <div class="submit-container">
        <button type="submit">更新資料</button>
    </div>
</form>
{% endblock %}
